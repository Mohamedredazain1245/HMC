<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم HMC</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Firebase (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --dark:#37423F; --dark-2:#2C3532; --cream:#DED2BE; --olive:#8F8A72;
    --line:#44514D; --white:#FAF8F4; --danger:#C0524A; --ok:#5C8368;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'IBM Plex Sans Arabic', sans-serif;
    background:var(--dark); color:var(--white); min-height:100vh;
  }
  h1,h2,h3,h4,button,.tab{font-family:'Cairo', sans-serif;}
  input,select,textarea{
    width:100%; padding:11px 12px; background:var(--dark-2); border:1px solid var(--line);
    color:var(--white); border-radius:4px; font-family:inherit; font-size:14px;
  }
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--olive);}
  label{display:block; font-size:13px; color:var(--cream); margin-bottom:6px; font-weight:600;}
  .field{margin-bottom:14px;}
  button{
    cursor:pointer; border:none; border-radius:4px; font-weight:700; font-size:14px;
    padding:11px 20px; transition:opacity .15s;
  }
  button:hover{opacity:.85;}
  .btn-primary{background:var(--cream); color:var(--dark-2);}
  .btn-ghost{background:transparent; color:var(--cream); border:1px solid var(--line);}
  .btn-danger{background:var(--danger); color:var(--white); padding:7px 14px; font-size:12.5px;}
  .btn-edit{background:var(--olive); color:var(--white); padding:7px 14px; font-size:12.5px;}

  /* Login */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-box{
    background:var(--dark-2); border:1px solid var(--line); border-radius:6px;
    padding:36px 32px; width:100%; max-width:380px;
  }
  .login-box h1{font-size:20px; margin-bottom:6px;}
  .login-box p{font-size:13px; color:var(--olive); margin-bottom:24px;}
  #login-error{color:var(--danger); font-size:13px; margin-top:10px; min-height:16px;}

  /* Dashboard */
  #dashboard{display:none;}
  header.top{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; border-bottom:1px solid var(--line); background:var(--dark-2);
  }
  header.top h1{font-size:18px;}
  .tabs{display:flex; gap:8px; padding:20px 28px 0;}
  .tab{
    padding:10px 20px; background:transparent; color:var(--olive); border:1px solid var(--line);
    border-bottom:none; border-radius:4px 4px 0 0; font-size:14px; font-weight:700; cursor:pointer;
  }
  .tab.active{background:var(--dark-2); color:var(--white);}
  .panel{display:none; padding:24px 28px 60px;}
  .panel.active{display:block;}
  .layout{display:grid; grid-template-columns:340px 1fr; gap:26px;}
  @media (max-width:900px){.layout{grid-template-columns:1fr;}}
  .formbox{
    background:var(--dark-2); border:1px solid var(--line); border-radius:6px; padding:22px;
    align-self:start;
  }
  .formbox h3{font-size:15px; margin-bottom:16px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .imgprev{width:100%; height:110px; object-fit:cover; border-radius:4px; margin-bottom:10px; display:none; border:1px solid var(--line);}
  .list{display:flex; flex-direction:column; gap:10px;}
  .item-card{
    background:var(--dark-2); border:1px solid var(--line); border-radius:6px;
    padding:14px 16px; display:flex; align-items:center; gap:14px;
  }
  .item-card img{width:56px; height:56px; object-fit:cover; border-radius:4px; flex-shrink:0;}
  .item-card .info{flex:1; min-width:0;}
  .item-card .info h4{font-size:14.5px; margin-bottom:3px;}
  .item-card .info p{font-size:12.5px; color:var(--olive); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item-card .badge{font-size:11px; background:var(--dark); border:1px solid var(--line); color:var(--cream); padding:3px 8px; border-radius:12px; margin-inline-start:6px;}
  .item-actions{display:flex; gap:8px; flex-shrink:0;}
  .empty-msg{color:var(--olive); font-size:13.5px; padding:20px; text-align:center; border:1px dashed var(--line); border-radius:6px;}
  .status-msg{font-size:13px; margin-top:10px; min-height:16px;}
  .status-msg.ok{color:var(--ok);} .status-msg.err{color:var(--danger);}
  .hint{font-size:12px; color:var(--olive); margin-top:-8px; margin-bottom:14px;}
  .toolbar{display:flex; justify-content:flex-end; margin-bottom:14px; gap:10px;}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login-screen">
  <div class="login-box">
    <h1>لوحة تحكم HMC</h1>
    <p>سجّل الدخول لإدارة محتوى الموقع</p>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="login-email" placeholder="admin@example.com">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="login-password" placeholder="••••••••">
    </div>
    <button class="btn-primary" style="width:100%;" onclick="doLogin()">دخول</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboard">
  <header class="top">
    <h1>لوحة تحكم HMC</h1>
    <button class="btn-ghost" onclick="doLogout()">تسجيل الخروج</button>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="equipment" onclick="switchTab('equipment')">المعدات</button>
    <button class="tab" data-tab="projects" onclick="switchTab('projects')">المشاريع</button>
    <button class="tab" data-tab="stats" onclick="switchTab('stats')">نقاط الشركة</button>
  </div>

  <!-- ===== EQUIPMENT PANEL ===== -->
  <div class="panel active" id="panel-equipment">
    <div class="layout">
      <div class="formbox">
        <h3 id="equipment-form-title">إضافة معدة جديدة</h3>
        <input type="hidden" id="equipment-id">
        <img class="imgprev" id="equipment-imgprev">
        <div class="field">
          <label>صورة المعدة</label>
          <input type="file" id="equipment-file" accept="image/*" onchange="uploadImage(this,'equipment')">
          <input type="hidden" id="equipment-image">
        </div>
        <div class="field"><label>الاسم (عربي)</label><input id="equipment-title-ar" placeholder="حفارات هيدروليكية"></div>
        <div class="field"><label>Name (English)</label><input id="equipment-title-en" placeholder="Hydraulic Excavators"></div>
        <div class="field"><label>الوصف (عربي)</label><textarea id="equipment-desc-ar" rows="2" placeholder="مقاسات مختلفة تناسب مواقع الحفر..."></textarea></div>
        <div class="field"><label>Description (English)</label><textarea id="equipment-desc-en" rows="2"></textarea></div>
        <div class="field"><label>ترتيب الظهور</label><input type="number" id="equipment-order" value="0"></div>
        <button class="btn-primary" style="width:100%;" onclick="saveEquipment()">حفظ</button>
        <button class="btn-ghost" style="width:100%; margin-top:8px; display:none;" id="equipment-cancel" onclick="resetEquipmentForm()">إلغاء التعديل</button>
        <div class="status-msg" id="equipment-status"></div>
      </div>
      <div>
        <div class="toolbar"><span class="hint" style="margin:0;">إجمالي: <span id="equipment-count">0</span></span></div>
        <div class="list" id="equipment-list"></div>
      </div>
    </div>
  </div>

  <!-- ===== PROJECTS PANEL ===== -->
  <div class="panel" id="panel-projects">
    <div class="layout">
      <div class="formbox">
        <h3 id="projects-form-title">إضافة مشروع جديد</h3>
        <input type="hidden" id="projects-id">
        <div class="field">
          <label>التخصص</label>
          <select id="projects-category">
            <option value="logistics">الدعم اللوجستي والتوريد</option>
            <option value="manpower">توفير العمالة</option>
            <option value="waste">إدارة النفايات</option>
            <option value="pest">مكافحة الآفات</option>
            <option value="subcontracting">مقاولات من الباطن</option>
            <option value="scrap">التعامل مع الخردة</option>
          </select>
        </div>
        <div class="field"><label>نوع الخدمة (عربي)</label><input id="projects-type-ar" placeholder="قطاع الطاقة الشمسية"></div>
        <div class="field"><label>Service Type (English)</label><input id="projects-type-en"></div>
        <div class="field"><label>عنوان المشروع (عربي)</label><input id="projects-title-ar" placeholder="مشروع السعدواي الشمسي"></div>
        <div class="field"><label>Project Title (English)</label><input id="projects-title-en"></div>
        <div class="field"><label>وصف المشروع (عربي)</label><textarea id="projects-desc-ar" rows="3"></textarea></div>
        <div class="field"><label>Project Description (English)</label><textarea id="projects-desc-en" rows="3"></textarea></div>
        <div class="row2">
          <div class="field"><label>المنطقة (عربي)</label><input id="projects-loc-ar" placeholder="منطقة الرياض"></div>
          <div class="field"><label>Region (English)</label><input id="projects-loc-en"></div>
        </div>
        <div class="row2">
          <div class="field"><label>السنة</label><input id="projects-year" placeholder="2026"></div>
          <div class="field"><label>ترتيب الظهور</label><input type="number" id="projects-order" value="0"></div>
        </div>
        <button class="btn-primary" style="width:100%;" onclick="saveProject()">حفظ</button>
        <button class="btn-ghost" style="width:100%; margin-top:8px; display:none;" id="projects-cancel" onclick="resetProjectForm()">إلغاء التعديل</button>
        <div class="status-msg" id="projects-status"></div>
      </div>
      <div>
        <div class="toolbar">
          <select id="projects-filter" onchange="renderProjects()" style="max-width:220px;">
            <option value="all">كل التخصصات</option>
            <option value="logistics">الدعم اللوجستي والتوريد</option>
            <option value="manpower">توفير العمالة</option>
            <option value="waste">إدارة النفايات</option>
            <option value="pest">مكافحة الآفات</option>
            <option value="subcontracting">مقاولات من الباطن</option>
            <option value="scrap">التعامل مع الخردة</option>
          </select>
        </div>
        <div class="list" id="projects-list"></div>
      </div>
    </div>
  </div>

  <!-- ===== STATS PANEL ===== -->
  <div class="panel" id="panel-stats">
    <div class="layout">
      <div class="formbox">
        <h3 id="stats-form-title">إضافة نقطة جديدة</h3>
        <input type="hidden" id="stats-id">
        <div class="hint">هذه النقاط تظهر في قسم "من نحن" بالموقع (حالياً 4 نقاط).</div>
        <div class="field"><label>العنوان (عربي)</label><input id="stats-title-ar" placeholder="تنفيذ متكامل"></div>
        <div class="field"><label>Title (English)</label><input id="stats-title-en"></div>
        <div class="field"><label>الوصف (عربي)</label><textarea id="stats-desc-ar" rows="2"></textarea></div>
        <div class="field"><label>Description (English)</label><textarea id="stats-desc-en" rows="2"></textarea></div>
        <div class="field"><label>ترتيب الظهور</label><input type="number" id="stats-order" value="0"></div>
        <button class="btn-primary" style="width:100%;" onclick="saveStat()">حفظ</button>
        <button class="btn-ghost" style="width:100%; margin-top:8px; display:none;" id="stats-cancel" onclick="resetStatForm()">إلغاء التعديل</button>
        <div class="status-msg" id="stats-status"></div>
      </div>
      <div class="list" id="stats-list"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   1) Firebase config — استبدل القيم دي بمفاتيح مشروعك في Firebase
   لازم تكون نفس المشروع اللي هيتحط في site.html عشان البيانات تتزامن
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCPHUtzqSHYoP-su3H13Ocj2uJ66q3xDbg",
  authDomain: "hmc-fb8d2.firebaseapp.com",
  projectId: "hmc-fb8d2",
  storageBucket: "hmc-fb8d2.firebasestorage.app",
  messagingSenderId: "938108838494",
  appId: "1:938108838494:web:117b3234b630405bfa8acf"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* ============================================================
   2) ImgBB API key — لرفع صور المعدات (مجاني من https://api.imgbb.com)
   ============================================================ */
const IMGBB_API_KEY = "757fcf457a1802a95acc928681e9eafc";

/* ---------------- AUTH ---------------- */
function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  auth.signInWithEmailAndPassword(email, password).catch(function(err){
    errEl.textContent = 'خطأ في تسجيل الدخول: ' + (err.message || err.code);
  });
}
function doLogout(){ auth.signOut(); }

auth.onAuthStateChanged(function(user){
  if(user){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadEquipment(); loadProjects(); loadStats();
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
  }
});

/* ---------------- TABS ---------------- */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.dataset.tab === name); });
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.toggle('active', p.id === 'panel-' + name); });
}

/* ---------------- IMAGE UPLOAD (ImgBB) ---------------- */
function uploadImage(input, prefix){
  const file = input.files[0];
  if(!file) return;
  const statusEl = document.getElementById(prefix + '-status');
  if(statusEl){ statusEl.className='status-msg'; statusEl.textContent = 'جاري رفع الصورة...'; }
  const formData = new FormData();
  formData.append('image', file);
  fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, { method:'POST', body: formData })
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data && data.data && data.data.url){
        document.getElementById(prefix + '-image').value = data.data.url;
        const prev = document.getElementById(prefix + '-imgprev');
        prev.src = data.data.url; prev.style.display = 'block';
        if(statusEl){ statusEl.className='status-msg ok'; statusEl.textContent = 'تم رفع الصورة بنجاح'; }
      } else {
        if(statusEl){ statusEl.className='status-msg err'; statusEl.textContent = 'فشل رفع الصورة، تأكد من مفتاح ImgBB'; }
      }
    })
    .catch(function(){
      if(statusEl){ statusEl.className='status-msg err'; statusEl.textContent = 'فشل رفع الصورة'; }
    });
}

/* ============================================================
   EQUIPMENT CRUD
   ============================================================ */
let equipmentCache = [];
function loadEquipment(){
  db.collection('equipment').orderBy('order').onSnapshot(function(snap){
    equipmentCache = [];
    snap.forEach(function(doc){ equipmentCache.push(Object.assign({id:doc.id}, doc.data())); });
    renderEquipment();
  }, function(err){ console.error(err); });
}
function renderEquipment(){
  document.getElementById('equipment-count').textContent = equipmentCache.length;
  const list = document.getElementById('equipment-list');
  if(equipmentCache.length === 0){
    list.innerHTML = '<div class="empty-msg">لا يوجد معدات مضافة بعد</div>';
    return;
  }
  list.innerHTML = equipmentCache.map(function(e){
    return '<div class="item-card">' +
      '<img src="' + (e.image || '') + '" onerror="this.style.display=\'none\'">' +
      '<div class="info"><h4>' + escapeHtml(e.title_ar || '') + '</h4><p>' + escapeHtml(e.desc_ar || '') + '</p></div>' +
      '<div class="item-actions">' +
        '<button class="btn-edit" onclick="editEquipment(\'' + e.id + '\')">تعديل</button>' +
        '<button class="btn-danger" onclick="deleteEquipment(\'' + e.id + '\')">حذف</button>' +
      '</div></div>';
  }).join('');
}
function saveEquipment(){
  const id = document.getElementById('equipment-id').value;
  const data = {
    title_ar: document.getElementById('equipment-title-ar').value.trim(),
    title_en: document.getElementById('equipment-title-en').value.trim(),
    desc_ar: document.getElementById('equipment-desc-ar').value.trim(),
    desc_en: document.getElementById('equipment-desc-en').value.trim(),
    image: document.getElementById('equipment-image').value.trim(),
    order: Number(document.getElementById('equipment-order').value) || 0
  };
  const statusEl = document.getElementById('equipment-status');
  if(!data.title_ar){ statusEl.className='status-msg err'; statusEl.textContent = 'من فضلك اكتب اسم المعدة بالعربي'; return; }
  const ref = id ? db.collection('equipment').doc(id) : db.collection('equipment').doc();
  ref.set(data, {merge:true}).then(function(){
    statusEl.className='status-msg ok'; statusEl.textContent = 'تم الحفظ بنجاح';
    resetEquipmentForm();
  }).catch(function(err){ statusEl.className='status-msg err'; statusEl.textContent = 'خطأ: ' + err.message; });
}
function editEquipment(id){
  const e = equipmentCache.find(function(x){ return x.id === id; });
  if(!e) return;
  document.getElementById('equipment-id').value = e.id;
  document.getElementById('equipment-title-ar').value = e.title_ar || '';
  document.getElementById('equipment-title-en').value = e.title_en || '';
  document.getElementById('equipment-desc-ar').value = e.desc_ar || '';
  document.getElementById('equipment-desc-en').value = e.desc_en || '';
  document.getElementById('equipment-image').value = e.image || '';
  document.getElementById('equipment-order').value = e.order || 0;
  const prev = document.getElementById('equipment-imgprev');
  if(e.image){ prev.src = e.image; prev.style.display='block'; } else { prev.style.display='none'; }
  document.getElementById('equipment-form-title').textContent = 'تعديل معدة';
  document.getElementById('equipment-cancel').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function resetEquipmentForm(){
  document.getElementById('equipment-id').value = '';
  ['title-ar','title-en','desc-ar','desc-en','image'].forEach(function(f){ document.getElementById('equipment-'+f).value=''; });
  document.getElementById('equipment-order').value = 0;
  document.getElementById('equipment-imgprev').style.display = 'none';
  document.getElementById('equipment-form-title').textContent = 'إضافة معدة جديدة';
  document.getElementById('equipment-cancel').style.display = 'none';
}
function deleteEquipment(id){
  if(!confirm('متأكد من حذف هذه المعدة؟')) return;
  db.collection('equipment').doc(id).delete();
}

/* ============================================================
   PROJECTS CRUD
   ============================================================ */
let projectsCache = [];
function loadProjects(){
  db.collection('projects').orderBy('order').onSnapshot(function(snap){
    projectsCache = [];
    snap.forEach(function(doc){ projectsCache.push(Object.assign({id:doc.id}, doc.data())); });
    renderProjects();
  }, function(err){ console.error(err); });
}
const categoryLabels = {
  logistics:'الدعم اللوجستي والتوريد', manpower:'توفير العمالة', waste:'إدارة النفايات',
  pest:'مكافحة الآفات', subcontracting:'مقاولات من الباطن', scrap:'التعامل مع الخردة'
};
function renderProjects(){
  const filter = document.getElementById('projects-filter').value;
  const list = document.getElementById('projects-list');
  const items = projectsCache.filter(function(p){ return filter === 'all' || p.category === filter; });
  if(items.length === 0){
    list.innerHTML = '<div class="empty-msg">لا يوجد مشاريع مضافة بعد</div>';
    return;
  }
  list.innerHTML = items.map(function(p){
    return '<div class="item-card">' +
      '<div class="info"><h4>' + escapeHtml(p.title_ar || '') + ' <span class="badge">' + (categoryLabels[p.category] || p.category) + '</span></h4>' +
      '<p>' + escapeHtml(p.desc_ar || '') + '</p></div>' +
      '<div class="item-actions">' +
        '<button class="btn-edit" onclick="editProject(\'' + p.id + '\')">تعديل</button>' +
        '<button class="btn-danger" onclick="deleteProject(\'' + p.id + '\')">حذف</button>' +
      '</div></div>';
  }).join('');
}
function saveProject(){
  const id = document.getElementById('projects-id').value;
  const data = {
    category: document.getElementById('projects-category').value,
    type_ar: document.getElementById('projects-type-ar').value.trim(),
    type_en: document.getElementById('projects-type-en').value.trim(),
    title_ar: document.getElementById('projects-title-ar').value.trim(),
    title_en: document.getElementById('projects-title-en').value.trim(),
    desc_ar: document.getElementById('projects-desc-ar').value.trim(),
    desc_en: document.getElementById('projects-desc-en').value.trim(),
    location_ar: document.getElementById('projects-loc-ar').value.trim(),
    location_en: document.getElementById('projects-loc-en').value.trim(),
    year: document.getElementById('projects-year').value.trim(),
    order: Number(document.getElementById('projects-order').value) || 0
  };
  const statusEl = document.getElementById('projects-status');
  if(!data.title_ar){ statusEl.className='status-msg err'; statusEl.textContent = 'من فضلك اكتب عنوان المشروع'; return; }
  const ref = id ? db.collection('projects').doc(id) : db.collection('projects').doc();
  ref.set(data, {merge:true}).then(function(){
    statusEl.className='status-msg ok'; statusEl.textContent = 'تم الحفظ بنجاح';
    resetProjectForm();
  }).catch(function(err){ statusEl.className='status-msg err'; statusEl.textContent = 'خطأ: ' + err.message; });
}
function editProject(id){
  const p = projectsCache.find(function(x){ return x.id === id; });
  if(!p) return;
  document.getElementById('projects-id').value = p.id;
  document.getElementById('projects-category').value = p.category || 'logistics';
  document.getElementById('projects-type-ar').value = p.type_ar || '';
  document.getElementById('projects-type-en').value = p.type_en || '';
  document.getElementById('projects-title-ar').value = p.title_ar || '';
  document.getElementById('projects-title-en').value = p.title_en || '';
  document.getElementById('projects-desc-ar').value = p.desc_ar || '';
  document.getElementById('projects-desc-en').value = p.desc_en || '';
  document.getElementById('projects-loc-ar').value = p.location_ar || '';
  document.getElementById('projects-loc-en').value = p.location_en || '';
  document.getElementById('projects-year').value = p.year || '';
  document.getElementById('projects-order').value = p.order || 0;
  document.getElementById('projects-form-title').textContent = 'تعديل مشروع';
  document.getElementById('projects-cancel').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function resetProjectForm(){
  document.getElementById('projects-id').value = '';
  ['type-ar','type-en','title-ar','title-en','desc-ar','desc-en','loc-ar','loc-en','year'].forEach(function(f){ document.getElementById('projects-'+f).value=''; });
  document.getElementById('projects-order').value = 0;
  document.getElementById('projects-category').value = 'logistics';
  document.getElementById('projects-form-title').textContent = 'إضافة مشروع جديد';
  document.getElementById('projects-cancel').style.display = 'none';
}
function deleteProject(id){
  if(!confirm('متأكد من حذف هذا المشروع؟')) return;
  db.collection('projects').doc(id).delete();
}

/* ============================================================
   STATS (about-points) CRUD
   ============================================================ */
let statsCache = [];
function loadStats(){
  db.collection('stats').orderBy('order').onSnapshot(function(snap){
    statsCache = [];
    snap.forEach(function(doc){ statsCache.push(Object.assign({id:doc.id}, doc.data())); });
    renderStats();
  }, function(err){ console.error(err); });
}
function renderStats(){
  const list = document.getElementById('stats-list');
  if(statsCache.length === 0){
    list.innerHTML = '<div class="empty-msg">لا يوجد نقاط مضافة بعد</div>';
    return;
  }
  list.innerHTML = statsCache.map(function(s){
    return '<div class="item-card">' +
      '<div class="info"><h4>' + escapeHtml(s.title_ar || '') + '</h4><p>' + escapeHtml(s.desc_ar || '') + '</p></div>' +
      '<div class="item-actions">' +
        '<button class="btn-edit" onclick="editStat(\'' + s.id + '\')">تعديل</button>' +
        '<button class="btn-danger" onclick="deleteStat(\'' + s.id + '\')">حذف</button>' +
      '</div></div>';
  }).join('');
}
function saveStat(){
  const id = document.getElementById('stats-id').value;
  const data = {
    title_ar: document.getElementById('stats-title-ar').value.trim(),
    title_en: document.getElementById('stats-title-en').value.trim(),
    desc_ar: document.getElementById('stats-desc-ar').value.trim(),
    desc_en: document.getElementById('stats-desc-en').value.trim(),
    order: Number(document.getElementById('stats-order').value) || 0
  };
  const statusEl = document.getElementById('stats-status');
  if(!data.title_ar){ statusEl.className='status-msg err'; statusEl.textContent = 'من فضلك اكتب العنوان'; return; }
  const ref = id ? db.collection('stats').doc(id) : db.collection('stats').doc();
  ref.set(data, {merge:true}).then(function(){
    statusEl.className='status-msg ok'; statusEl.textContent = 'تم الحفظ بنجاح';
    resetStatForm();
  }).catch(function(err){ statusEl.className='status-msg err'; statusEl.textContent = 'خطأ: ' + err.message; });
}
function editStat(id){
  const s = statsCache.find(function(x){ return x.id === id; });
  if(!s) return;
  document.getElementById('stats-id').value = s.id;
  document.getElementById('stats-title-ar').value = s.title_ar || '';
  document.getElementById('stats-title-en').value = s.title_en || '';
  document.getElementById('stats-desc-ar').value = s.desc_ar || '';
  document.getElementById('stats-desc-en').value = s.desc_en || '';
  document.getElementById('stats-order').value = s.order || 0;
  document.getElementById('stats-form-title').textContent = 'تعديل نقطة';
  document.getElementById('stats-cancel').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}
function resetStatForm(){
  document.getElementById('stats-id').value = '';
  ['title-ar','title-en','desc-ar','desc-en'].forEach(function(f){ document.getElementById('stats-'+f).value=''; });
  document.getElementById('stats-order').value = 0;
  document.getElementById('stats-form-title').textContent = 'إضافة نقطة جديدة';
  document.getElementById('stats-cancel').style.display = 'none';
}
function deleteStat(id){
  if(!confirm('متأكد من حذف هذه النقطة؟')) return;
  db.collection('stats').doc(id).delete();
}

/* ---------------- helpers ---------------- */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}
